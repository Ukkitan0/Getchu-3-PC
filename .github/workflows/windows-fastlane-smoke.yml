name: Windows native runtime smoke (no game data)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-fastlane-smoke.yml'
      - 'tools/windows_upstream_patch.py'
      - 'tools/prepare_disc.py'
      - 'tools/test_prepare_disc.py'
      - 'tools/boot_report.py'
      - 'tools/test_boot_report.py'
      - 'tools/bulk_recompile.py'
      - 'tools/aot_cache.py'
      - 'tools/test_native_resume.py'
      - 'tools/native_explore.py'
      - 'tools/test_windows_fastlane.py'
      - 'tools/synthetic_aot_smoke.py'
      - 'tools/synthetic_ctors_smoke.py'
      - 'tools/synthetic_pages_smoke.py'
      - 'tools/synthetic_overlay_smoke.py'
      - 'tools/run_synthetic_overlay_windows.ps1'
      - 'tools/test_synthetic_pages_smoke.py'
      - 'tools/run_synthetic_aot_windows.ps1'
      - 'tools/test_synthetic_aot*.py'
      - 'RUN_BULK_NATIVE_WINDOWS.ps1'
      - 'TEST_APE_ESCAPE_3_WINDOWS.ps1'
      - 'tools/test_launcher_argument_binding.ps1'
      - 'tools/diagnostic_bundle.py'
      - 'tools/test_diagnostic_bundle.py'
      - 'TEST_APE_ESCAPE_3_WINDOWS.bat'
      - 'tools/test_synthetic_aot_contract.py'
      - 'fastlane/ci_stub/**'

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline Python regression suite
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p 'test_windows_fastlane.py' -v
          python -m unittest discover -s tools -p 'test_native_resume.py' -v
          python -m unittest discover -s tools -p 'test_synthetic*.py' -v
          python -m unittest discover -s tools -p 'test_prepare_disc.py' -v
          python -m unittest discover -s tools -p 'test_boot_report.py' -v
          python -m unittest discover -s tools -p 'test_diagnostic_bundle.py' -v
          $tokens = $null; $errors = $null
          foreach ($script in @('RUN_BULK_NATIVE_WINDOWS.ps1','TEST_APE_ESCAPE_3_WINDOWS.ps1','tools/run_synthetic_overlay_windows.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path '${{ github.workspace }}' $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ('Invalid Windows PowerShell syntax in ' + $script + ': ' + ($errors | Out-String)) }
          }
          # Full-game bulk tests consume the owner's recovered opcode inventory,
          # intentionally absent from the public GitHub source checkout.
      - name: Verify one-click launcher binds ExploreRounds and SeedMode correctly
        shell: pwsh
        run: |
          & "tools/test_launcher_argument_binding.ps1"
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch exact known upstream revision
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/snuri00/ps2-web-recomp.git "$env:RUNNER_TEMP\upstream"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C "$env:RUNNER_TEMP\upstream" checkout --detach 6526f4803d98e10de50bea3af104a4d26e9df033
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Synthetic disc boot and executable code-window discovery on pinned upstream parser
        shell: pwsh
        run: |
          $env:AE3_UPSTREAM_PATH = "$env:RUNNER_TEMP\upstream"
          python -m unittest discover -s tools -p 'test_prepare_disc.py' -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Apply tested Win32 portability overlay
        shell: pwsh
        run: |
          py -3 tools/windows_upstream_patch.py --upstream "$env:RUNNER_TEMP\upstream" --report "$env:RUNNER_TEMP\windows_port_report.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install SDL2 for the Windows native runner
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'Runner vcpkg unavailable' }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sdl2:x64-windows
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build native EE compiler + VU compiler (ClangCL)
        shell: pwsh
        run: |
          cmake -S "$env:RUNNER_TEMP\upstream" -B "$env:RUNNER_TEMP\tools-build" -G 'Visual Studio 17 2022' -A x64 -T ClangCL
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build "$env:RUNNER_TEMP\tools-build" --config Release --target eerecomp vurecomp --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Link source-only ps2run.exe against native runtime
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -S "$env:RUNNER_TEMP\upstream" -B "$env:RUNNER_TEMP\runtime-build" -G 'Visual Studio 17 2022' -A x64 -T ClangCL '-DPS2_GENERATED=${{ github.workspace }}/fastlane/ci_stub' '-DAE3_REQUIRE_SDL2=ON' "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build "$env:RUNNER_TEMP\runtime-build" --config Release --target ps2run --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $runner = "$env:RUNNER_TEMP\runtime-build\Release\ps2run.exe"
          if (-not (Test-Path -LiteralPath $runner)) { throw 'Runtime executable absent' }
          # Use Start-Process so the runner usage exit code (2) does not
          # become a PowerShell native-command error before we check it.
          $usage = "$env:RUNNER_TEMP\usage.txt"
          $proc = Start-Process -FilePath $runner -PassThru -Wait -NoNewWindow -RedirectStandardError $usage
          if ($proc.ExitCode -ne 2) { throw "Unexpected no-argument runner exit code $($proc.ExitCode)" }
      - name: Translate and execute game-free R5900 AOT program on real Windows runtime
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          & "tools/run_synthetic_aot_windows.ps1" -Upstream "$env:RUNNER_TEMP\upstream" -Compiler "$env:RUNNER_TEMP\tools-build\Release\eerecomp.exe" -RuntimeBuild "$env:RUNNER_TEMP\runtime-build" -VcpkgToolchain $toolchain
      - name: Translate and run 143 indirect MIPS callbacks in native Windows
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          & "tools/run_synthetic_aot_windows.ps1" -Upstream "$env:RUNNER_TEMP\upstream" -Compiler "$env:RUNNER_TEMP\tools-build\Release\eerecomp.exe" -RuntimeBuild "$env:RUNNER_TEMP\runtime-build" -VcpkgToolchain $toolchain -FixtureMode constructors -TimeoutSeconds 60
      - name: Execute 143 spread-out R5900 callbacks across seven AOT regions and RAM pages
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          & "tools/run_synthetic_aot_windows.ps1" -Upstream "$env:RUNNER_TEMP\upstream" -Compiler "$env:RUNNER_TEMP\tools-build\Release\eerecomp.exe" -RuntimeBuild "$env:RUNNER_TEMP\runtime-build" -VcpkgToolchain $toolchain -FixtureMode pages -TimeoutSeconds 60
      - name: Capture and recompile genuinely unpacked MIPS code in native Windows runtime
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          & "tools/run_synthetic_overlay_windows.ps1" -Upstream "$env:RUNNER_TEMP\upstream" -Compiler "$env:RUNNER_TEMP\tools-build\Release\eerecomp.exe" -RuntimeBuild "$env:RUNNER_TEMP\runtime-build" -VcpkgToolchain $toolchain -TimeoutSeconds 60
      - name: Compile Win32 WebGPU renderer against verified official wgpu-native
        shell: pwsh
        run: |
          $asset = 'https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-windows-x86_64-msvc-release.zip'
          $expected = '7E67D7445C42AEB85E30F88930FD8D7D83EE769E3390AEB1ADA75EBF3CF78132'
          $zip = "$env:RUNNER_TEMP\wgpu.zip"
          $wgpu = "$env:RUNNER_TEMP\wgpu-native"
          Invoke-WebRequest -Uri $asset -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "wgpu-native archive SHA mismatch $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $wgpu -Force
          if (-not (Test-Path "$wgpu\lib\wgpu_native.lib")) { throw 'wgpu native import/static lib missing' }
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -S "$env:RUNNER_TEMP\upstream" -B "$env:RUNNER_TEMP\gpu-build" -G 'Visual Studio 17 2022' -A x64 -T ClangCL '-DPS2_GENERATED=${{ github.workspace }}/fastlane/ci_stub' '-DAE3_REQUIRE_SDL2=ON' "-DPS2_WGPU_DIR=$wgpu" "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build "$env:RUNNER_TEMP\gpu-build" --config Release --target ps2run --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\gpu-build\Release\ps2run.exe")) { throw 'Native GPU-linked runner missing' }
      - name: Upload portable-runtime diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-portability-smoke
          path: |
            ${{ runner.temp }}/windows_port_report.json
            ${{ runner.temp }}/usage.txt
            ${{ runner.temp }}/runtime-build/ae3-aot-smoke/aot-smoke-result.json
            ${{ runner.temp }}/runtime-build/ae3-aot-smoke/aot-smoke-stderr.txt
            ${{ runner.temp }}/runtime-build/ae3-aot-constructors/aot-smoke-result.json
            ${{ runner.temp }}/runtime-build/ae3-aot-constructors/aot-smoke-stderr.txt
            ${{ runner.temp }}/runtime-build/ae3-aot-constructors/aot-smoke-stdout.txt
            ${{ runner.temp }}/runtime-build/ae3-aot-pages/aot-smoke-result.json
            ${{ runner.temp }}/runtime-build/ae3-aot-overlay/overlay-aot-result.json
            ${{ runner.temp }}/runtime-build/ae3-aot-overlay/first-run.stderr.txt
            ${{ runner.temp }}/runtime-build/ae3-aot-overlay/recompiled-run.stderr.txt
            ${{ runner.temp }}/runtime-build/ae3-aot-overlay/misses.txt
            ${{ runner.temp }}/runtime-build/ae3-aot-pages/aot-smoke-stderr.txt
            ${{ runner.temp }}/runtime-build/ae3-aot-pages/aot-smoke-stdout.txt
            ${{ runner.temp }}/runtime-build/ae3-aot-smoke/aot-smoke-stdout.txt
            ${{ runner.temp }}/runtime-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/gpu-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore