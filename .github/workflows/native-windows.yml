name: TRUE native Windows C++ and Direct3D11 port
on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - "BUILD_NATIVE_WINDOWS.bat"
      - "TEST_APE_ESCAPE_3_WINDOWS.bat"
      - ".github/workflows/native-windows.yml"
jobs:
  native-win64:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline owned-game Lua 5.0 decompilation helper (synthetic files)
        shell: pwsh
        run: |
          python -m unittest discover -s native/tools -p 'test_recover_lua50.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s native/tools -p 'test_prepare_owned_assets.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s native/tools -p 'test_convert_models_to_glb.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate native-only local asset-preparation PowerShell syntax
        shell: pwsh
        run: |
          $script = "native/tools/PREPARE_NATIVE_ASSETS_WINDOWS.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Native owned-asset preparation launcher syntax: OK'
      - name: Validate original retail game asset pipeline
        shell: pwsh
        run: |
          python -m py_compile native/tools/audit_original_stage.py native/tools/recover_lua50.py native/tools/prepare_owned_assets.py native/tools/convert_models_to_glb.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure native host-only engine
        shell: pwsh
        run: |
          cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native Direct3D11 executable and asset tools
        shell: pwsh
        run: |
          cmake --build native/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real native ISO9660 and VFI archive extraction
        shell: pwsh
        run: |
          ctest --test-dir native/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate and inspect host-native textured 3D arena fixture
        shell: pwsh
        run: |
          python native/tools/make_scene_fixture.py native/build/native_arena_test.glb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & native/build/Release/Getchu3GlbSceneProbe.exe native/build/native_arena_test.glb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate host-native AE3 level instance placement, original PCK and I3M tools
        shell: pwsh
        run: |
          python native/tools/make_level_fixture.py native/build/native_synthetic_level
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & native/build/Release/Getchu3LevelSceneProbe.exe native/build/native_synthetic_level native/build/native_synthetic_level/placeholder.plc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Level native composition, PLC placement and mesh materials OK'
      - name: Decode and inspect actual Ape Escape 3 I3D_I3C structure on Windows
        shell: pwsh
        run: |
          python native/tools/make_i3c_fixture.py native/build/native_collision_cube.i3c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & native/build/Release/Getchu3I3cProbe.exe native/build/native_collision_cube.i3c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Genuine I3D_I3C structure parsed into native collision triangles, no PS2 hardware'
      - name: Verify native glTF animated skeleton and save legal skinned fixture
        shell: pwsh
        run: |
          & native/build/Release/Getchu3NativeSkinningTests.exe native/build/native_bone_animation_test.glb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & native/build/Release/Getchu3SkinningProbe.exe native/build/native_bone_animation_test.glb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test full native Lua stage with simultaneously rendered player and monkey models
        shell: pwsh
        run: |
          python native/tools/make_actor_scene_fixture.py native/build/native_lua_actor_stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & native/build/Release/Getchu3ActorWorldProbe.exe native/build/native_lua_actor_stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Original-style Lua new_ent -> 3 independent native C++ GLB player/monkey instances'
          # Separate proof: BOTH Lua monkey actors use their own identical
          # animated skeletal GLB resource but retain independent runtimes.
          Copy-Item -LiteralPath native/build/native_lua_actor_stage -Destination native/build/native_lua_animated_stage -Recurse -Force
          Copy-Item -LiteralPath native/build/native_bone_animation_test.glb -Destination native/build/native_lua_animated_stage/native_dummy_monkey.glb -Force
          $report = & native/build/Release/Getchu3ActorWorldProbe.exe native/build/native_lua_animated_stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report | ForEach-Object { Write-Host $_ }
          if (($report -join "`n") -notmatch 'Independent skeleton animators: 2') {
            throw 'Expected two independent Lua-created skinned monkey actors'
          }
      - name: Confirm compiled EXEs and native Win32 dependencies
        shell: pwsh
        run: |
          $p = "native/build/Release"
          foreach ($name in @("Getchu3Native.exe", "Getchu3AssetProbe.exe", "Getchu3StageProbe.exe", "Getchu3LuaStageRunner.exe", "Getchu3GlbSceneProbe.exe", "Getchu3LevelSceneProbe.exe", "Getchu3PckProbe.exe", "Getchu3I3mProbe.exe", "Getchu3I3cProbe.exe", "Getchu3SkinningProbe.exe", "Getchu3ActorWorldProbe.exe")) {
            if (-not (Test-Path -LiteralPath "$p/$name")) { throw "Missing native EXE $name" }
          }
          # Search executable CMake statements, not comments documenting
          # specifically excluded emulators. Previous CI falsely rejected
          # CMake because the phrase "no PCSX2" was present in a comment.
          $native = ((Get-Content native/CMakeLists.txt) |
            Where-Object { $_ -notmatch '^\s*#' }) -join "`n"
          if ($native -match '(?i)ps2run|eerecomp|pcsx2|PS2_GENERATED') {
            throw "Console hardware runtime dependency was found in executable native CMake"
          }
          Write-Host "Only Win32, Direct3D11 and standard C++: no EE interpreter, IOP runtime or PS2 GS"
      - uses: actions/upload-artifact@v4
        with:
          name: Getchu3-TRUE-NATIVE-Windows-x64-engine-test
          path: |
            native/build/Release/Getchu3Native.exe
            native/build/Release/Getchu3AssetProbe.exe
            native/build/Release/Getchu3StageProbe.exe
            native/build/Release/Getchu3LuaStageRunner.exe
            native/build/Release/Getchu3GlbSceneProbe.exe
            native/build/Release/Getchu3LevelSceneProbe.exe
            native/build/Release/Getchu3PckProbe.exe
            native/build/Release/Getchu3I3mProbe.exe
            native/build/Release/Getchu3I3cProbe.exe
            native/build/Release/Getchu3SkinningProbe.exe
            native/build/Release/Getchu3ActorWorldProbe.exe
            native/build/native_lua_actor_stage/
            native/build/native_bone_animation_test.glb
            native/build/native_collision_cube.i3c
            native/build/native_synthetic_level/
            native/build/native_arena_test.glb
            native/examples/native_binding_demo.lua
          if-no-files-found: error
